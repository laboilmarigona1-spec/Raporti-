<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>LAB OIL – Raporti Ditor</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eef2f7;background:#08111c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#08111c,#101b2a);min-height:100vh}
.wrap{max-width:620px;margin:auto;padding:18px 14px 35px}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:48px;height:48px;border-radius:14px;background:#d71920;display:grid;place-items:center;font-weight:900;font-size:19px;box-shadow:0 8px 24px #0006}
h1{font-size:22px;margin:0}.sub{color:#9eacbc;font-size:13px;margin-top:3px}
.card{background:#111d2b;border:1px solid #26364a;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 25px #0004}
label{display:block;font-size:13px;color:#aebdcd;margin:0 0 6px}
input{width:100%;border:1px solid #34475e;background:#0b1522;color:white;border-radius:11px;padding:13px;font-size:17px;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
button{width:100%;border:0;border-radius:13px;padding:14px 16px;font-weight:800;font-size:16px;cursor:pointer}
.primary{background:#e31b23;color:#fff}.green{background:#18a957;color:#fff}.secondary{background:#243449;color:#fff}
.small{font-size:12px;color:#94a6b8;line-height:1.45}.status{margin-top:10px;padding:10px;border-radius:10px;background:#0a1522;color:#b8c7d8;display:none}
.preview{width:100%;max-height:280px;object-fit:contain;border-radius:12px;margin-top:10px;display:none;background:#000}
.report{white-space:pre-wrap;background:#09131f;border:1px dashed #3a5068;border-radius:12px;padding:14px;line-height:1.55;font-size:15px}
.row{display:flex;gap:9px}.row>*{flex:1}
hr{border:0;border-top:1px solid #293b50;margin:14px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">LO</div>
    <div><h1>LAB OIL – Raporti Ditor</h1><div class="sub">Pika Marigone • foto → tekst → WhatsApp</div></div>
  </div>

  <div class="card">
    <label>1. Ngarko ose fotografo X-raportin</label>
    <div class="row"><button type="button" id="galleryBtn" class="secondary">🖼️ Zgjidh nga galeria</button><button type="button" id="cameraBtn" class="secondary">📷 Bëj foto</button></div><input id="photo" type="file" accept=".jpg,.jpeg,.png,.webp" style="display:none"><input id="camera" type="file" accept=".jpg,.jpeg,.png,.webp" capture="environment" style="display:none">
    <img id="preview" class="preview">
    <button id="ocrBtn" class="primary" style="margin-top:10px">🔍 Lexo X-raportin</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <div class="grid">
      <div><label>Benzin 95 (L)</label><input id="b95" inputmode="decimal" placeholder="230.350"></div>
      <div><label>Benzin 98 (L)</label><input id="b98" inputmode="decimal" placeholder="59.690"></div>
      <div><label>Dizel (L)</label><input id="diesel" inputmode="decimal" placeholder="1696.720"></div>
      <div><label>Marketi (€)</label><input id="market" inputmode="decimal" placeholder="386.60"></div>
      <div><label>Total (€)</label><input id="total" inputmode="decimal" placeholder="3618.66"></div>
      <div><label>Data</label><input id="date" type="date"></div>
      <div class="full"><label>Ora e qarkullimit</label><input id="time" type="time" value="20:00"></div>
    </div>
  </div>

  <div class="card">
    <label>2. Kontrollo raportin</label>
    <div id="report" class="report">Plotëso fushat ose bëj foto të X-raportit.</div>
    <div class="row" style="margin-top:10px">
      <button id="copyBtn" class="secondary">📋 Kopjo</button>
      <button id="waBtn" class="green">🟢 WhatsApp</button>
    </div>
  </div>

  <div class="card small">
    <b>Shënim:</b> OCR është ndihmës dhe mund të ngatërrojë ndonjë shifër. Kontrolloji numrat para se t'ia dërgosh shefit. Nëse fotoja nuk lexohet mirë, mund t'i shkruash manualisht në fushat sipër.
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const photoInput=$("photo"), cameraInput=$("camera");
$("galleryBtn").onclick=()=>photoInput.click();
$("cameraBtn").onclick=()=>cameraInput.click();
function selectFile(f){ if(!f)return; const dt=new DataTransfer(); dt.items.add(f); photoInput.files=dt.files; photoInput.dispatchEvent(new Event("change")); }
cameraInput.addEventListener("change",()=>selectFile(cameraInput.files[0]));
const fields=['b95','b98','diesel','market','total','date','time'];
function nowDefaults(){
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  $('date').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
nowDefaults();

function num(id){return ($(id).value||'').trim().replace(',','.')}
function prettyDate(v){
  if(!v)return '01.10.2026';
  const [y,m,d]=v.split('-'); return d+'.'+m+'.'+y;
}
function build(){
  const r=`Pika Marigone

{Benzin95}:${num('b95')}L
{Benzin98}:${num('b98')}L
Dizel: ${num('diesel')}L

Marketi:${num('market')}€
Total: ${num('total')}€

Qarkullimi ditor ${prettyDate($('date').value)} deri në ora ${$('time').value||'20:00'}`;
  $('report').textContent=r; return r;
}
fields.forEach(id=>$(id).addEventListener('input',build));
build();

$('photo').addEventListener('change',()=>{
 const f=$('photo').files[0]; if(!f)return;
 $('preview').src=URL.createObjectURL(f); $('preview').style.display='block';
 $('status').style.display='block'; $('status').textContent='Fotoja u zgjodh. Shtyp “Lexo X-raportin”.';
});

function normText(s){
 return s.toUpperCase().replace(/\u00A0/g,' ').replace(/\s+/g,' ').trim();
}
function nums(s){ return [...s.matchAll(/\b\d{1,5}\.\d{2,3}\b/g)].map(m=>m[0]); }
function money(s){ return [...s.matchAll(/\b\d{2,5}\.\d{2}\b/g)].map(m=>m[0]); }
function parseOCR(raw){
 const lines=raw.split(/\n+/).map(normText).filter(Boolean);
 let out={b95:'',b98:'',diesel:'',market:'',total:''};

 const sections=[[/KARBURANT.*(?:#|H|H\s*)[O0]?1|KARBURANT.*1\b/,'b95'],[/KARBURANT.*(?:#|H|H\s*)[O0]?2|KARBURANT.*2\b/,'b98'],[/KARBURANT.*(?:#|H|H\s*)[O0]?3|KARBURANT.*3\b/,'diesel']];
 for(const [re,id] of sections){
   const i=lines.findIndex(x=>re.test(x));
   if(i>=0){
     for(let j=i;j<Math.min(i+8,lines.length);j++){
       for(const v of nums(lines[j])){
         const n=parseFloat(v);
         if(n>10&&n<3000){out[id]=v;break;}
       }
       if(out[id])break;
     }
   }
 }
 const liters=[];
 for(let i=0;i<lines.length;i++){
   if(/L[1I]TRA|LITRA/.test(lines[i])){
     for(let j=i;j<Math.min(i+3,lines.length);j++){
       const v=nums(lines[j]).find(x=>parseFloat(x)>10&&parseFloat(x)<3000);
       if(v){liters.push(v);break;}
     }
   }
 }
 if(liters.length>=3){
   out.b95=out.b95||liters[0]; out.b98=out.b98||liters[1]; out.diesel=out.diesel||liters[2];
 }
 for(let i=0;i<lines.length;i++){
   if(/T[O0]TAL\s+BRUT[O0]|BRUT[O0]/.test(lines[i])){
     const v=money(lines[i]); if(v.length) out.market=v[v.length-1];
     else if(i+1<lines.length){const n=money(lines[i+1]);if(n.length)out.market=n[0];}
   }
 }
 for(let i=0;i<lines.length;i++){
   if(/PARA\s+TE\s+GATSHME|PARA\s+T[EE]\s+GATSHME/.test(lines[i])){
     const vals=money(lines[i]);
     if(vals.length) out.total=vals[vals.length-1];
     else if(i+1<lines.length){
       const vals2=money(lines[i+1]);
       if(vals2.length) out.total=vals2[0];
     }
   }
   if(out.total)break;
 }
 if(!out.total){
   for(let i=0;i<lines.length;i++){
     if(/T[O0]TAL\s+N[EE]T[O0]|GJENDJA\s+NE\s+ARKE|GJENDJA/.test(lines[i])){
       for(let j=i;j<Math.min(i+4,lines.length);j++){
         const v=money(lines[j]).find(x=>parseFloat(x)>=1000&&parseFloat(x)<10000);
         if(v){out.total=v;break;}
       }
     }
     if(out.total)break;
   }
 }
 return out;
}
async function preprocess(file, mode, crop){
 return new Promise((resolve,reject)=>{
   const img=new Image();
   img.onload=()=>{
     const scale=mode===0?2.5:3.2;
     const sx=crop==='right'?img.naturalWidth/2:0;
     const sw=crop==='full'?img.naturalWidth:img.naturalWidth/2;
     const c=document.createElement('canvas');
     c.width=Math.round(sw*scale); c.height=Math.round(img.naturalHeight*scale);
     const ctx=c.getContext('2d',{willReadFrequently:true});
     ctx.drawImage(img,sx,0,sw,img.naturalHeight,0,0,c.width,c.height);
     if(mode===1){
       const d=ctx.getImageData(0,0,c.width,c.height);
       for(let i=0;i<d.data.length;i+=4){
         const g=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];
         const v=g>180?255:g<135?0:g;
         d.data[i]=d.data[i+1]=d.data[i+2]=v;
       }
       ctx.putImageData(d,0,0);
     }
     c.toBlob(b=>b?resolve(b):reject(new Error('preprocess')),'image/png',1);
   };
   img.onerror=reject; img.src=URL.createObjectURL(file);
 });
}
$('ocrBtn').onclick=async()=>{
 const f=$('photo').files[0];
 if(!f){$('status').style.display='block';$('status').textContent='Së pari zgjidh foton.';return}
 $('ocrBtn').disabled=true;$('status').style.display='block';
 try{
   let combined='';
   const jobs=[[0,'full'],[1,'full'],[1,'right']];
   for(let k=0;k<jobs.length;k++){
     const [mode,crop]=jobs[k];
     $('status').textContent='⏳ Po lexoj fotografin…';
     const img=await preprocess(f,mode,crop);
     const {data}=await Tesseract.recognize(img,'eng',{
       logger:m=>{if(m.status==='recognizing text')$('status').textContent='⏳ OCR '+Math.round((m.progress||0)*100)+'%';},
       tessedit_pageseg_mode:crop==='full'?'11':'6'
     });
     combined+='\n'+data.text;
   }
   const p=parseOCR(combined);
   for(const [k,v] of Object.entries(p))if(v)$(k).value=v;
   build();
   const found=Object.values(p).filter(Boolean).length;
   $('status').textContent=found>=4?'✅ U lexuan të dhënat. Kontrolloji shifrat para dërgimit.':found>0?'⚠️ U lexuan vetëm disa të dhëna.':'⚠️ OCR nuk po i dallon numrat. Provo foton më afër dhe më të ndriçuar.';
 }catch(e){console.error(e);$('status').textContent='❌ Gabim gjatë leximit. Provo përsëri.'}
 finally{$('ocrBtn').disabled=false}
};

$('copyBtn').onclick=async()=>{
 const r=build();
 try{await navigator.clipboard.writeText(r); $('copyBtn').textContent='✅ U kopjua'; setTimeout(()=>$('copyBtn').textContent='📋 Kopjo',1500)}
 catch{alert('Nuk u kopjua automatikisht. Zgjidhe tekstin dhe kopjoje.')}
};
$('waBtn').onclick=()=>{const r=build(); location.href='https://wa.me/?text='+encodeURIComponent(r)};
</script>
</body>
</html>
